spring.application.name=myproject
server.port=8081

# Database Configuration (Read from environment variables; DO NOT commit secrets)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spotifix}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.initialization-fail-timeout=60000
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false

# Session Cookie Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Media / Uploads Configuration
spotifix.upload.dir=${SPOTIFIX_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Jamendo API Configuration
jamendo.api.client-id=${JAMENDO_CLIENT_ID:}
jamendo.api.base-url=${JAMENDO_BASE_URL:https://api.jamendo.com/v3.0}

# YouTube Data API v3 Configuration
youtube.api.key=${YOUTUBE_API_KEY:}
youtube.api.base-url=${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}


