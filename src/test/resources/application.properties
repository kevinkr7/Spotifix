spring.application.name=myproject-test

# Use in-memory H2 database in PostgreSQL compatibility mode for tests
spring.datasource.url=jdbc:h2:mem:spotifixtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

spotifix.upload.dir=target/test-uploads

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# YouTube Test Defaults
youtube.api.key=
youtube.api.base-url=https://www.googleapis.com/youtube/v3
